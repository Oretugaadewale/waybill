name: Live checks

# Read-only checks against the deployed site: after each production deploy,
# every morning, and on demand. The full booking-and-payment journey saves a
# real (test-mode) booking, so it only runs when started by hand with
# "allow_writes" ticked.

on:
  deployment_status:
  schedule:
    - cron: "17 5 * * *" # 6:17am in Lagos
  workflow_dispatch:
    inputs:
      allow_writes:
        description: "Also run the full journey (saves one paid test booking)"
        type: boolean
        default: false

concurrency:
  group: live-checks
  cancel-in-progress: false

jobs:
  live:
    name: Live site checks
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_TARGET: live
      WAYBILL_LIVE_URL: https://waybill-dusky.vercel.app
      E2E_ALLOW_WRITES: ${{ inputs.allow_writes && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:live

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
